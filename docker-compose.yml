services:
  postgres_db:
    image: postgres:16
    container_name: chatbot_profile_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: a
      POSTGRES_DB: chatbot_profile
    ports:
      - "54322:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatbot_profile"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
